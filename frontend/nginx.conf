server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy opcional hacia la API para dejar todo en el mismo origen.
    # Si lo activás, rebuild con VITE_API_URL=/api/v1 y sacás CORS_ORIGINS
    # de la config (el browser nunca hace un request cross-origin).
    #
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # La SPA no tiene router: todo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
